# HUMANITY LOOP REVIEW-ONLY candidate for PolicyEngine-US #10517.
# NOT merged upstream, NOT executed in the full PolicyEngine Simulation.
# NH He-W 670.03(b)(3)-(5): round FANF grant down to whole dollars;
# suppress a pre-adjustment monthly grant below $10.
# Sources:
# https://gc.nh.gov/rules/state_agencies/he-w600.html
# https://github.com/PolicyEngine/policyengine-us/issues/10517
# https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/tests/policy/baseline/gov/states/nh/dhhs/fanf/integration.yaml

- name: Review candidate A - enrolled two-person NH family, pre-adjustment grant 9.99 is suppressed.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 24288.24  # annual; monthly/2 = 1012.01
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 0
        is_tanf_enrolled: true
    households:
      household:
        members: [person1, person2]
        state_code: NH
  output:
    nh_fanf_payment_standard: 1022
    nh_fanf_eligible: true
    nh_fanf: 0

