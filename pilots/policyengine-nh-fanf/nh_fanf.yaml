# Review-only candidate for PolicyEngine-US issue #10517
# https://gc.nh.gov/rules/state_agencies/he-w600.html He-W 670.03(b)(3)-(5)
# These use explicit upstream variables, not real applicants' records.
- name: NH FANF fractional award rounded down, not nearest dollar
  period: 2025-01
  input:
    state_code: NH
    nh_fanf_eligible: true
    nh_fanf_payment_standard: 1_332.50
    nh_fanf_countable_income: 750
  output:
    nh_fanf: 582

- name: NH FANF pre-rounding grant under ten dollars yields no payment
  period: 2025-01
  input:
    state_code: NH
    nh_fanf_eligible: true
    nh_fanf_payment_standard: 1_332.50
    nh_fanf_countable_income: 1_327
  output:
    nh_fanf: 0

- name: NH FANF exactly ten-dollar award is payable
  period: 2025-01
  input:
    state_code: NH
    nh_fanf_eligible: true
    nh_fanf_payment_standard: 1_332.50
    nh_fanf_countable_income: 1_322.50
  output:
    nh_fanf: 10

- name: NH FANF fractional award just above ten rounds down to ten
  period: 2025-01
  input:
    state_code: NH
    nh_fanf_eligible: true
    nh_fanf_payment_standard: 110.99
    nh_fanf_countable_income: 100
  output:
    nh_fanf: 10

- name: NH FANF just below minimum does not pay
  period: 2025-01
  input:
    state_code: NH
    nh_fanf_eligible: true
    nh_fanf_payment_standard: 109.99
    nh_fanf_countable_income: 100
  output:
    nh_fanf: 0

- name: NH FANF original whole dollar benefit unchanged
  period: 2024-01
  input:
    state_code: NH
    nh_fanf_eligible: true
    nh_fanf_payment_standard: 1_022
    nh_fanf_countable_income: 400
  output:
    nh_fanf: 622

- name: NH FANF ineligible benefit remains zero
  period: 2024-01
  input:
    state_code: NH
    nh_fanf_eligible: false
    nh_fanf_payment_standard: 1_022
    nh_fanf_countable_income: 0
  output:
    nh_fanf: 0
