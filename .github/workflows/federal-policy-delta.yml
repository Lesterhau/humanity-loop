name: Federal Policy Delta

on:
  push:
    branches: [main]
    paths:
      - 'scripts/federal_policy_delta.py'
      - 'scripts/test_federal_policy_delta.py'
      - '.github/workflows/federal-policy-delta.yml'
  schedule:
    # Original cadence is 11:15 AM America/New_York. Two UTC slots plus the DST gate preserve it.
    - cron: '15 15 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: federal-policy-delta
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout canonical repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Select the DST-correct scheduled slot
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          event_schedule = os.environ.get("EVENT_SCHEDULE", "")
          offset = datetime.now(timezone.utc).astimezone(ZoneInfo("America/New_York")).utcoffset()
          expected = "15 15 * * *" if offset and offset.total_seconds() == -4 * 3600 else "15 16 * * *"
          should_run = event_name != "schedule" or event_schedule == expected

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_run={'true' if should_run else 'false'}\n")
          print(f"event={event_name} schedule={event_schedule!r} expected={expected!r} should_run={should_run}")
          PY

      - name: Run deterministic tests
        if: steps.gate.outputs.should_run == 'true'
        env:
          PYTHONPATH: scripts
        run: python3 -m unittest scripts/test_federal_policy_delta.py

      - name: Detect official-source changes
        if: steps.gate.outputs.should_run == 'true'
        run: python3 scripts/federal_policy_delta.py

      - name: Verify receipt
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("runtime/federal-policy-delta/latest-run.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["schemaVersion"] == 1
          assert data["sourcesConfigured"] == 17
          assert data["changesDetected"] == len(data["changes"])
          assert data["failuresCount"] == len(data["failures"])
          for change in data["changes"]:
              assert change["reviewStatus"] == "needs-neutral-human-or-agent-review"
              assert change["legalConclusion"] is None
          print(
              f"verified sources={data['sourcesConfigured']} "
              f"baselines={data['baselinesCreated']} "
              f"changes={data['changesDetected']} failures={data['failuresCount']}"
          )
          PY

      - name: Commit snapshots and receipts
        if: steps.gate.outputs.should_run == 'true'
        run: |
          if [ -z "$(git status --porcelain -- runtime/federal-policy-delta)" ]; then
            echo "No policy runtime changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/federal-policy-delta
          git commit -m "runtime: record federal policy delta scan"
          git pull --rebase origin main
          git push origin HEAD:main
