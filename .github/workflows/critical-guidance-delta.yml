name: Critical Guidance Delta

on:
  push:
    branches: [main]
    paths:
      - 'scripts/critical_guidance_delta.py'
      - 'scripts/test_critical_guidance_delta.py'
      - 'scripts/monitor_cadence_gate.py'
      - 'scripts/test_monitor_cadence_gate.py'
      - '.github/workflows/critical-guidance-delta.yml'
  schedule:
    # Catch-up slots: no more than once per five hours based on durable receipt.
    # GitHub schedules can be delayed/skipped: this is not a guaranteed SLA.
    - cron: '23 */3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/critical_guidance_delta.py'
      - 'scripts/test_critical_guidance_delta.py'
      - 'scripts/monitor_cadence_gate.py'
      - 'scripts/test_monitor_cadence_gate.py'
      - '.github/workflows/critical-guidance-delta.yml'

permissions:
  contents: write

concurrency:
  group: critical-guidance-delta
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout canonical repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Refresh canonical main before deciding whether a scan is due
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Run deterministic tests
        env:
          PYTHONPATH: scripts
        run: python3 -m unittest scripts/test_critical_guidance_delta.py scripts/test_monitor_cadence_gate.py

      - name: Check time since the last durable receipt
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          from pathlib import Path
          from monitor_cadence_gate import scan_due
          due = scan_due(Path('runtime/critical-guidance-delta/latest-run.json'), os.environ['EVENT_NAME'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('due=' + ('true' if due else 'false') + '\n')
          print('critical_guidance_scan_due=', due)
          PY

      - name: Detect authoritative guidance changes
        if: steps.cadence.outputs.due == 'true'
        run: |
          set +e
          python3 scripts/critical_guidance_delta.py
          result=$?
          set -e
          if [ "$result" -eq 2 ]; then
            echo "::warning::All sources failed; retaining receipt for audit and final failure status."
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          fi

      - name: Verify receipt
        if: steps.cadence.outputs.due == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("runtime/critical-guidance-delta/latest-run.json").read_text(encoding="utf-8"))
          assert data["schemaVersion"] == 1
          assert data["sourcesConfigured"] == 3
          assert data["changesDetected"] == len(data["changes"])
          assert data["failuresCount"] == len(data["failures"])
          for change in data["changes"]:
              assert change["materiality"] == "unreviewed"
              assert change["severity"] == "unreviewed"
              assert change["medicalAdvice"] is None
          print(
              f"verified checked={data['sourcesChecked']} "
              f"baselines={data['baselinesCreated']} "
              f"changes={data['changesDetected']} failures={data['failuresCount']}"
          )
          PY

      - name: Commit snapshots and receipts
        if: steps.cadence.outputs.due == 'true'
        run: |
          if [ -z "$(git status --porcelain -- runtime/critical-guidance-delta)" ]; then
            echo "No guidance runtime changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/critical-guidance-delta
          git commit -m "runtime: record critical guidance scan"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail visibly if source coverage was incomplete
        if: steps.cadence.outputs.due == 'true'
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          from pathlib import Path
          from monitor_cadence_gate import receipt_coverage_complete
          receipt = json.loads(Path("runtime/critical-guidance-delta/latest-run.json").read_text())
          if not receipt_coverage_complete(receipt):
              print(f"::error::Critical Guidance incomplete: {receipt.get('sourcesChecked')} of "
                    f"{receipt.get('sourcesConfigured')} sources checked; "
                    f"{receipt.get('failuresCount')} source failures. Durable receipt committed.")
              raise SystemExit(1)
          print("All configured sources were checked with zero failures.")
          PY
