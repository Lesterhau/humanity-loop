name: Ops Sentinel — independent watchdog

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ops_sentinel.js'
      - 'scripts/test_ops_sentinel.js'
      - '.github/workflows/ops-sentinel.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: humanity-loop-ops-sentinel
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read canonical repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run deterministic watchdog regression tests
        run: node --test scripts/test_ops_sentinel.js

      - name: Read live receipts and maintain ONE alert issue
        if: github.event_name != 'push'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('node:path');
            const { evaluate, alertBody, ALERT_TITLE, persistReport } = require(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts/ops_sentinel.js')
            );
            const r = evaluate();
            console.log(JSON.stringify(r, null, 2));
            const { owner, repo } = context.repo;
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100, sort: 'created', direction: 'desc'
            });
            const issue = all.find(i => i.title === ALERT_TITLE && !i.pull_request);
            const unhealthy = ['warning', 'critical'].includes(r.status);
            const body = alertBody(r);
            const marker = '<!-- sentinel:' + r.fingerprint + ' -->';
            if (unhealthy && !issue) {
              try {
                await github.rest.issues.create({owner, repo, title: ALERT_TITLE, body, assignees: [owner]});
              } catch (err) {
                if (err.status !== 422) throw err;
                await github.rest.issues.create({owner, repo, title: ALERT_TITLE, body});
              }
              console.log('Created one Ops Sentinel alert issue.');
            } else if (unhealthy && issue) {
              if (issue.state === 'closed') {
                await github.rest.issues.update({owner, repo, issue_number: issue.number, state: 'open', body});
                await github.rest.issues.createComment({owner, repo, issue_number: issue.number,
                  body: 'A new abnormal condition was independently observed. See updated checklist. No production job was modified.'});
              } else if (!(issue.body || '').includes(marker)) {
                await github.rest.issues.update({owner, repo, issue_number: issue.number, body});
                await github.rest.issues.createComment({owner, repo, issue_number: issue.number,
                  body: 'The monitored health state changed. Review the latest issue description. No production job was modified.'});
              }
            } else if (!unhealthy && issue && issue.state === 'open') {
              await github.rest.issues.createComment({owner, repo, issue_number: issue.number,
                body: 'All four monitored checks are now healthy; the independent GitHub watchdog is closing this narrow alert.'});
              await github.rest.issues.update({owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'});
            }
            console.log('Canonical daily/transition receipt changed: ' + persistReport(r));

      - name: Persist daily or changed-state watchdog report
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain -- runtime/ops-sentinel/latest.json)" ]; then
            echo "No new daily/transition receipt; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ops-sentinel/latest.json
          git commit -m "runtime: record independent Ops Sentinel status"
          git pull --rebase origin main
          git push origin HEAD:main
