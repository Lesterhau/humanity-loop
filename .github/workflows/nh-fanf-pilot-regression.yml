name: NH FANF pilot offline regression

on:
  push:
    paths:
      - "pilots/policyengine-nh-fanf/**"
      - ".github/workflows/nh-fanf-pilot-regression.yml"
  pull_request:
    paths:
      - "pilots/policyengine-nh-fanf/**"
      - ".github/workflows/nh-fanf-pilot-regression.yml"

permissions:
  contents: read

jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the candidate and offline tests without importing PolicyEngine
        run: python -m py_compile pilots/policyengine-nh-fanf/nh_fanf.py pilots/policyengine-nh-fanf/test_formula_offline.py pilots/policyengine-nh-fanf/test_candidate_formula_offline.py
      - name: Run pure arithmetic and actual-candidate mocked scalar regression
        run: python -m unittest discover -s pilots/policyengine-nh-fanf -p 'test*.py' -v
      - name: Scope note
        run: echo "Offline scalar tests only; this is not PolicyEngine integration or program adoption."
