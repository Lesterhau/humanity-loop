name: G3 one-shot isolated inference acceptance (fixture only)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/g3-isolated-inference-once.yml'
      - 'scripts/g3-isolated-inference/**'
permissions:
  contents: read
concurrency:
  group: g3-isolated-inference-once
  cancel-in-progress: false
jobs:
  isolated-inference:
    if: github.repository == 'Lesterhau/humanity-loop' && github.event.pull_request.head.repo.full_name == 'Lesterhau/humanity-loop' && github.head_ref == 'test/g3-isolated-inference-20261124' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Offline adapter regression
        run: |
          bash -n scripts/g3-isolated-inference/run-ci.sh
          python3 -m unittest discover -s scripts/g3-isolated-inference -p 'test_*.py' -v
      - name: Execute at most one network-isolated fixture run
        # Single bounded Qwen3 download-repair acceptance attempt; no automatic retry.
        if: github.event.action == 'synchronize' && github.event.before == '42c709ef6a2ba832d9028bbbc59a07cb7b7aeea1'
        env:
          HL_APPROVED_ONE_SHOT: 'true'
        run: bash scripts/g3-isolated-inference/run-ci.sh
