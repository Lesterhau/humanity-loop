name: MCP lockfile refresh

on:
  push:
    paths:
      - "mcp-server/package.json"
      - ".github/workflows/mcp-lockfile.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "mcp: pin dependency graph"
          git push
