name: Psychological maintenance model tests

on:
  push:
    paths:
      - "scripts/psychological_maintenance_capacity.py"
      - "scripts/test_psychological_maintenance_capacity.py"
      - "PSYCHOLOGICAL-MAINTENANCE-MODEL.md"
      - ".github/workflows/psychological-maintenance.yml"
  pull_request:
    paths:
      - "scripts/psychological_maintenance_capacity.py"
      - "scripts/test_psychological_maintenance_capacity.py"
      - "PSYCHOLOGICAL-MAINTENANCE-MODEL.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test_psychological_maintenance_capacity.py
