name: CAP Daily Audit

on:
  schedule:
    # GitHub schedules are UTC. Two slots plus the DST gate preserve 10:30 AM America/New_York.
    - cron: '30 14 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cap-daily-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout canonical repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Select the DST-correct scheduled slot
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          event_schedule = os.environ.get("EVENT_SCHEDULE", "")
          offset = datetime.now(timezone.utc).astimezone(
              ZoneInfo("America/New_York")
          ).utcoffset()

          expected = "30 14 * * *" if offset and offset.total_seconds() == -4 * 3600 else "30 15 * * *"
          should_run = event_name != "schedule" or event_schedule == expected

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_run={'true' if should_run else 'false'}\n")
              out.write(f"expected_schedule={expected}\n")

          print(
              f"event={event_name} schedule={event_schedule!r} "
              f"expected={expected!r} should_run={should_run}"
          )
          PY

      - name: Run deterministic tests
        if: steps.gate.outputs.should_run == 'true'
        env:
          PYTHONPATH: scripts
        run: python3 -m unittest scripts/test_cap_daily_audit.py

      - name: Run CAP audit
        if: steps.gate.outputs.should_run == 'true'
        run: python3 scripts/cap_daily_audit.py

      - name: Verify run receipt
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("runtime/cap-daily-audit/latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["schemaVersion"] == 1
          assert data["source"] == "https://api.weather.gov/alerts/active"
          assert isinstance(data["alertsChecked"], int)
          assert isinstance(data["findings"], list)
          assert data["findingsCount"] == len(data["findings"])
          assert data["findingsCount"] == sum(data["bySeverity"].values())

          print(
              f"verified alerts={data['alertsChecked']} "
              f"findings={data['findingsCount']} "
              f"runAt={data['runAt']}"
          )
          PY

      - name: Commit durable run receipts
        if: steps.gate.outputs.should_run == 'true'
        run: |
          if [ -z "$(git status --porcelain -- runtime/cap-daily-audit)" ]; then
            echo "No runtime receipt changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/cap-daily-audit
          git commit -m "runtime: record CAP daily audit"
          git pull --rebase origin main
          git push origin HEAD:main
