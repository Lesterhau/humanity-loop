name: Publish Humanity Loop release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - server.json
      - plugin/humanity-loop/**
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          VERSION=$(jq -r '.version' server.json)
          test -n "$VERSION"
          test "$VERSION" != "null"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate plugin version matches release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PLUGIN_VERSION=$(jq -r '.version' plugin/humanity-loop/plugin.json)
          test "$PLUGIN_VERSION" = "$VERSION"

      - name: Build portal-ready plugin ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd plugin/humanity-loop
          zip -r "../../humanity-loop-plugin-$VERSION.zip" . \
            -x "*.DS_Store" "__MACOSX/*"
          cd ../..
          unzip -t "humanity-loop-plugin-$VERSION.zip"

      - name: Create tagged release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Humanity Loop $TAG" \
              --notes "Public remote-MCP discovery release. Includes the production Streamable HTTP MCP endpoint, bounded passive contributor-node tools, official MCP Registry metadata, portable Agent Plugin packaging, and cross-client connection documentation."
          fi

      - name: Attach portal-ready plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$TAG" "humanity-loop-plugin-$VERSION.zip" --clobber
