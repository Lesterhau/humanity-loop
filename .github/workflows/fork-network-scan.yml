name: Fork Network Scan

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan direct and second-generation public forks
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = 11;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function listForks(o, r) {
              const response = await github.paginate(github.rest.repos.listForks, {
                owner: o,
                repo: r,
                per_page: 100,
                sort: 'newest'
              });
              return response;
            }

            const direct = await listForks(owner, repo);
            const discovered = new Map();

            for (const fork of direct.slice(0, 100)) {
              discovered.set(fork.html_url, {
                full_name: fork.full_name,
                html_url: fork.html_url,
                parent: `${owner}/${repo}`,
                generation: 1,
                created_at: fork.created_at
              });

              try {
                const children = await listForks(fork.owner.login, fork.name);
                for (const child of children.slice(0, 100)) {
                  discovered.set(child.html_url, {
                    full_name: child.full_name,
                    html_url: child.html_url,
                    parent: fork.full_name,
                    generation: 2,
                    created_at: child.created_at
                  });
                }
              } catch (err) {
                core.info(`Could not scan descendants of ${fork.full_name}: ${err.message}`);
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const seenText = comments.map(c => c.body || '').join('\n');

            const fresh = [...discovered.values()].filter(x => !seenText.includes(x.html_url));
            if (fresh.length === 0) {
              core.info('No new public forks found.');
              return;
            }

            const lines = [
              '## Fork network scan — new public forks',
              '',
              ...fresh.map(x =>
                `- [${x.full_name}](${x.html_url}) — generation ${x.generation}, parent: ${x.parent}, created: ${x.created_at}`
              ),
              '',
              'This is lineage monitoring only. Divergence is not treated as harmful by default.'
            ];

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: lines.join('\n')
            });
