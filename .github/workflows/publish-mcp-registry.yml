name: Publish MCP Registry metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check production MCP endpoint
        run: |
          curl --fail --silent --show-error --max-time 20 \
            -H 'Accept: application/json, text/event-stream' \
            https://humanity-loop.vercel.app/api/mcp \
            -o /dev/null || true
          curl --fail --silent --show-error --max-time 20 \
            https://humanity-loop.vercel.app/api/v1?tool=get_protocol \
            -o /dev/null

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate with official MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        run: ./mcp-publisher publish server.json
