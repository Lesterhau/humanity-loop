name: Validate Humanity Loop ledger

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_ledger.py
      - name: Enforce mission finish line and real win-ledger count (offline)
        run: |
          python -m unittest discover -s scripts -p test_mission_control.py -v
          python scripts/mission_control.py --at 2026-11-22T05:00:00Z > /tmp/mission-gate.json
          python -c 'import json; m=json.load(open("/tmp/mission-gate.json")); assert m["active_gate"]=="G2" and m["verified_win_records"]==4 and m["external_volunteers_required"] is False and m["can_autocontact_institutions"] is False and m["new_model_calls"]==0'
      - name: Check public contributor intake response SLA (offline)
        run: node --test scripts/test_contributor_intake_sla.js
      - name: Check public Waystation reply monitoring (offline)
        run: node --test scripts/test_waystation_reply_watch.js
      - name: Verify privacy and onboarding disclosure contract (offline)
        run: node --test scripts/test_join_privacy_copy.js
      - name: Reject stale beta invitation and retention misconceptions (offline)
        run: node --test scripts/test_first_independent_beta_contract.js
      - name: Verify MCP tool metadata and permission hints (offline)
        run: node --test scripts/test_mcp_tool_metadata.js
      - name: Foundry Lite local-only eight-stage safety tests
        run: python -m unittest discover -s scripts -p test_foundry_lite.py -v
      - name: Foundry Lite cross-platform laptop readiness safety tests
        run: python -m unittest discover -s scripts -p test_foundry_lite_doctor.py -v
      - name: Foundry Lite doctor (no model, no network)
        run: python scripts/foundry_lite_doctor.py --json
      - name: G3 official-source snapshot security tests (offline, no HTTP requests)
        run: python -m unittest discover -s scripts -p test_public_source_snapshot.py -v
      - name: G3 real-source archive to Foundry review-plan handoff (offline)
        run: |
          python -m unittest discover -s scripts -p test_public_source_handoff.py -v
          python scripts/public_source_handoff.py --task foundry-lite/fixtures/ot013-pk-climate-review.json --snapshot runtime/mission/2026-11-23-ot013-official-html-snapshot.json --output /tmp/ot013-live-sourced-review-candidate.json
          python scripts/foundry_lite.py --input foundry-lite/fixtures/ot013-pk-climate-review.json --source-packet /tmp/ot013-live-sourced-review-candidate.json --mode plan --output /tmp/ot013-live-sourced-review-plan.json
          python -c 'import json; p=json.load(open("/tmp/ot013-live-sourced-review-plan.json")); assert p["status"]=="offline_review_plan_only" and p["model_calls"]==0 and p["public_sources_fetched"]==0 and p["independently_verified"] is False and p["source_candidate"]["arithmetic_checks"][0]["calculated_percent_1dp"]=="71.8" and p["source_candidate"]["eligible_for_win_ledger"] is False'
      - name: G3/G4 source-grounded two-country execution tests (no model, network or writes)
        run: |
          python -m unittest discover -s scripts -p test_foundry_source_evidence.py -v
          python scripts/foundry_lite.py --input foundry-lite/fixtures/ot003-us-bilingual-review.json --source-packet foundry-lite/fixtures/ot003-us-bilingual-source-candidate.json --mode plan --output /tmp/ot003-source-review-plan.json
          python scripts/foundry_lite.py --input foundry-lite/fixtures/ot013-pk-climate-review.json --source-packet foundry-lite/fixtures/ot013-pk-climate-source-candidate.json --mode plan --output /tmp/ot013-source-review-plan.json
          python -c 'import json; a=json.load(open("/tmp/ot003-source-review-plan.json")); b=json.load(open("/tmp/ot013-source-review-plan.json")); assert a["status"]=="offline_review_plan_only" and b["status"]=="offline_review_plan_only" and a["source_candidate"]["country"]=="US" and b["source_candidate"]["country"]=="PK" and a["source_candidate"]["language_competence_required"] is True and b["source_candidate"]["arithmetic_checks"][0]["calculated_percent_1dp"]=="71.8" and all(x["model_calls"]==0 and x["independently_verified"] is False and x["public_sources_fetched"]==0 and x["appdeploy_credits_used"]==0 for x in (a,b))'
      - name: Foundry Lite deterministic review plan (no inference or source access)
        run: |
          python scripts/foundry_lite.py --input foundry-lite/fixtures/public-onboarding-review.json --mode plan --output /tmp/foundry-lite-plan.json
          python -c 'import json; p=json.load(open("/tmp/foundry-lite-plan.json")); assert p["status"]=="offline_review_plan_only" and p["model_calls"]==0 and p["appdeploy_credits_used"]==0 and p["public_sources_fetched"]==0 and p["independently_verified"] is False and p["human_review"]=="required" and len(p["checklist"])>=3'
      - name: Foundry Lite zero-inference manifest preflight
        run: |
          python scripts/foundry_lite.py --input foundry-lite/fixtures/public-onboarding-review.json --mode inspect --output /tmp/foundry-lite-preflight.json
          python -c 'import json; p=json.load(open("/tmp/foundry-lite-preflight.json")); assert p["status"]=="preflight_only" and p["model_calls"]==0 and p["external_actions"]==0 and p["appdeploy_credits_used"]==0'
